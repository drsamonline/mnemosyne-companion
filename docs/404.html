<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Mnemosyne Companion</title>
<link rel="icon" type="image/svg+xml" href="/mnemosyne-companion/assets/icon.svg">
<style>
:root{--plum:#2b1055;--gold:#d4af37;--parchment:#f3ecdc;--dim:#cbbfe0;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
  background:radial-gradient(900px 600px at 50% 0%,rgba(212,175,55,.10),transparent 60%),linear-gradient(180deg,#2b1055,#140628);
  color:var(--parchment);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:32px}
.mark{width:64px;height:64px;border-radius:16px;margin:0 auto 22px;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,#f0dc9a,var(--gold) 58%,#8a6c12);color:#2b1055;
  font-family:var(--serif);font-weight:700;font-size:34px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
h1{font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 10px}
p{color:var(--dim);max-width:46ch;margin:0 auto 26px}
a.btn{display:inline-block;background:linear-gradient(180deg,#e8cd78,var(--gold));color:#2b1055;
  text-decoration:none;font-weight:600;padding:13px 26px;border-radius:999px;border:1px solid #f0dc9a}
a.alt{color:var(--gold);text-decoration:none;margin-left:18px}
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>This page is not in the library</h1>
    <p>The page you asked for could not be found. Mnemosyne remembers a great deal — but not this address.</p>
    <a class="btn" href="/mnemosyne-companion/">Return to the landing page</a>
    <a class="alt" href="/mnemosyne-companion/play/">Open the app</a>
  </main>
</body>
</html>
